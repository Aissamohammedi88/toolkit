name: "01 - Auto Format"
on:
  push:
    branches: [ main, master ]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: "Install Formatters"
        run: |
          pip install black isort
          npm install -g prettier
      - name: "Format All Languages"
        run: |
          find . -name "*.py" -not -path "./.git/*" -exec black {} + || true
          find . -name "*.py" -not -path "./.git/*" -exec isort {} + || true
          if [ -f package.json ]; then npx prettier --write . || true; fi
      - name: "Commit Changes"
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-format code [skip ci]"
          branch: ${{ github.head_ref }}
