jobs:
  job1:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.gen.outputs.version }}
      build_id: ${{ steps.gen.outputs.build_id }}
    steps:
      - id: gen
        run: |
          echo "version=1.0" >> $GITHUB_OUTPUT
          echo "build_id=42" >> $GITHUB_OUTPUT
 job2:
    needs: job1
    runs-on: ubuntu-latest
    steps:
      - run: echo "Version ${{ needs.job1.outputs.app_version }}"
