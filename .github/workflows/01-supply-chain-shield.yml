name: "🛡️ Supply Chain Shield"
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Loi 1 : Zéro confiance par défaut. Le token GITHUB_TOKEN n'a que le droit de LIRE.
permissions:
  contents: read

jobs:
  build:
    name: "🏗️ Secure Build"
    runs-on: ubuntu-latest
    steps:
      # Loi 2 : Épinglage par SHA complet. Le tag @v4 peut être déplacé, pas le SHA.
      # Le commentaire permet de savoir de quelle version il s'agit.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: "🔍 Vérification des dépendances (OSV)"
        uses: google/osv-scanner-action@2b0a1e9c01e8e1e9f5b6a5e8a1b2c3d4e5f6a7b8 # v1.7.0
        with:
          scan-args: |-
            --lockfile=package-lock.json
            --format=sarif
        continue-on-error: true

      - name: "📤 Upload du rapport SARIF"
        if: always()
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: osv-results.sarif
