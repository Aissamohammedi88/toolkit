# ═══════════════════════════════════════════════════════════════════════════════
# NEXUS UNIVERSAL CODER v2 — Agent Autonome Multi-Langages
# ═══════════════════════════════════════════════════════════════════════════════
# Correction architecturale :
#   - La matrice ne lit plus les outputs (impossible).
#   - La logique conditionnelle est déplacée au niveau des steps (if).
#   - Actions épinglées par version stable.
# ═══════════════════════════════════════════════════════════════════════════════
name: Universal Coder Agent

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    types: [opened, synchronize]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── JOB 1 : DÉTECTION DES LANGAGES ──────────────────────────────────────────
  detect-languages:
    name: "🔍 Detect Languages"
    runs-on: ubuntu-latest
    outputs:
      languages: ${{ steps.linguist.outputs.languages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true # Active le cache natif pour Ruby

      - name: Install Linguist
        run: gem install github-linguist

      - name: Detect Languages
        id: linguist
        run: |
          # On extrait les clés du JSON et on les joint par une virgule
          LANGUAGES=$(github-linguist --breakdown --json | jq -r 'keys[]' | tr '\n' ',')
          echo "languages=$LANGUAGES" >> $GITHUB_OUTPUT
          echo "Detected: $LANGUAGES"
  # ─── JOB 2 : AUTO-FIX MULTI-LANGAGES ────────────────────────────────────────
  auto-fix:
    name: "🔧 Auto-Fix"
    needs: detect-languages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- PYTHON ---
      - name: Fix Python (Ruff)
        if: contains(needs.detect-languages.outputs.languages, 'Python')
        run: |
          pip install ruff
          ruff check --fix .
          ruff format .

      # --- JAVASCRIPT / TYPESCRIPT ---
      - name: Fix JS/TS (ESLint)
        if: contains(needs.detect-languages.outputs.languages, 'JavaScript') || contains(needs.detect-languages.outputs.languages, 'TypeScript')
        run: |
          npm install -g eslint
          npx eslint . --fix || true
      # --- GO ---
      - name: Fix Go (gofmt)
        if: contains(needs.detect-languages.outputs.languages, 'Go')
        run: |
          go fmt ./...
      # --- RUST ---
      - name: Fix Rust (rustfmt)
        if: contains(needs.detect-languages.outputs.languages, 'Rust')
        run: |
          rustup component add rustfmt
          cargo fmt

      # --- COMMIT GLOBAL ---
      - name: Commit Auto-Fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-fix code formatting"
          commit_options: '--no-verify'

  # ─── JOB 3 : DÉTECTION DE CONFLITS (SÉCURISÉ) ───────────────────────────────
  check-conflicts:
    name: "🔀 Check Conflicts"
    needs: detect-languages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Merge Conflicts
        id: conflicts
        run: |
          git fetch origin ${{ github.base_ref }}
          if git merge --no-commit --no-ff origin/${{ github.base_ref }}; then
            echo "has_conflicts=false" >> $GITHUB_OUTPUT
            git merge --abort
          else
            echo "has_conflicts=true" >> $GITHUB_OUTPUT
            git merge --abort
          fi

      - name: Comment on PR
        if: steps.conflicts.outputs.has_conflicts == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '⚠️ **Merge conflicts detected.** Please resolve them manually. (Auto-resolution is disabled for safety).'
            })

  # ─── JOB 4 : MISE À JOUR DES WORKFLOWS (SÉCURISÉ) ───────────────────────────
  update-workflows:
    name: "🔄 Update Actions"
    needs: detect-languages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Dependabot
        uses: dependabot/fetch-metadata@v2
        continue-on-error: true

      # Au lieu de gh-aw (non officiel), on utilise un script qui met à jour les tags @vX vers la dernière stable.
      - name: Update Actions Versions
        run: |
          echo "Updating GitHub Actions versions..."
          # Exemple simplifié : on peut utiliser une action dédiée comme renovate
          # Pour l'exemple, on fait un simple sed (très basique, à remplacer par renovate)
          find .github/workflows -name "*.yml" -exec sed -i 's|uses: actions/checkout@v3|uses: actions/checkout@v4|g' {} +

      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: bump action versions"
          commit_options: '--no-verify'

  # ─── JOB 5 : ANALYSE DE SÉCURITÉ ────────────────────────────────────────────
  security-scan:
    name: "🛡️ Security Scan"
    needs: detect-languages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy
        uses: aquasecurity/trivy-action@0.20.0 # Version épinglée (plus sûr que @master)
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
