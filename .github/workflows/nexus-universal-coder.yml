# ═══════════════════════════════════════════════════════════════════════════════
# NEXUS UNIVERSAL CODER v2.1 — Agent Autonome Multi-Langages
# ═══════════════════════════════════════════════════════════════════════════════

name: Universal Coder Agent

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    types: [opened, synchronize]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

# Ajout de attestations: write pour le Job 6
permissions:
  contents: write
  pull-requests: write
  security-events: write
  actions: read
  id-token: write        # Requis pour l'attestation OIDC
  attestations: write    # Requis pour générer le SLSA

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── JOB 1 : DÉTECTION DES LANGAGES ──────────────────────────────────────────
  detect-languages:
    name: "🔍 Detect Languages"
    runs-on: ubuntu-latest
    outputs:
      languages: ${{ steps.linguist.outputs.languages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Install Linguist
        run: gem install github-linguist
      - name: Detect Languages
        id: linguist
        run: |
          LANGUAGES=$(github-linguist --breakdown --json | jq -r 'keys[]' | tr '\n' ',')
          echo "languages=$LANGUAGES" >> $GITHUB_OUTPUT
          echo "Detected: $LANGUAGES"

  # ─── JOB 2 : AUTO-FIX MULTI-LANGAGES ────────────────────────────────────────
  auto-fix:
    name: "🔧 Auto-Fix"
    needs: detect-languages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Python (Ruff)
        if: contains(needs.detect-languages.outputs.languages, 'Python')
        run: |
          pip install ruff
          ruff check --fix .
          ruff format .
      - name: Fix JS/TS (ESLint)
        if: contains(needs.detect-languages.outputs.languages, 'JavaScript') || contains(needs.detect-languages.outputs.languages, 'TypeScript')
        run: |
          npm install -g eslint
          npx eslint . --fix || true
      - name: Fix Go (gofmt)
        if: contains(needs.detect-languages.outputs.languages, 'Go')
        run: go fmt ./...
      - name: Fix Rust (rustfmt)
        if: contains(needs.detect-languages.outputs.languages, 'Rust')
        run: |
          rustup component add rustfmt
          cargo fmt
      - name: Commit Auto-Fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-fix code formatting"
          commit_options: '--no-verify'

  # ─── JOB 3 : DÉTECTION DE CONFLITS (SÉCURISÉ) ───────────────────────────────
  check-conflicts:
    name: "🔀 Check Conflicts"
    needs: detect-languages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect Merge Conflicts
        id: conflicts
        run: |
          git fetch origin ${{ github.base_ref }}
          if git merge --no-commit --no-ff origin/${{ github.base_ref }}; then
            echo "has_conflicts=false" >> $GITHUB_OUTPUT
            git merge --abort
          else
            echo "has_conflicts=true" >> $GITHUB_OUTPUT
            git merge --abort
          fi
      - name: Comment on PR
        if: steps.conflicts.outputs.has_conflicts == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '⚠️ **Merge conflicts detected.** Please resolve them manually.'
            })

  # ─── JOB 4 : MISE À JOUR DES WORKFLOWS ──────────────────────────────────────
  update-workflows:
    name: "🔄 Update Actions"
    needs: detect-languages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Actions Versions
        run: |
          echo "Updating GitHub Actions versions..."
          find .github/workflows -name "*.yml" -exec sed -i 's|uses: actions/checkout@v3|uses: actions/checkout@v4|g' {} +
      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: bump action versions"
          commit_options: '--no-verify'

  # ─── JOB 5 : ANALYSE DE SÉCURITÉ ────────────────────────────────────────────
  security-scan:
    name: "🛡️ Security Scan"
    needs: detect-languages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy
        uses: aquasecurity/trivy-action@0.20.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # ─── JOB 6 : BUILD & ATTESTATION (SLSA) ─────────────────────────────────────
  # C'est ici que la magie de la Supply Chain opère.
  build-and-attest:
    name: "🔏 Build & Attest Provenance"
    needs: [auto-fix, security-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. On simule un build qui produit un artefact (binaire, dossier, zip...)
      - name: Build Artifact
        run: |
          mkdir -p dist
          echo "Nexus Universal Coder - Secure Build $(date)" > dist/nexus-coder.bin
          echo "Build complete."

      # 2. L'étape que tu as demandée : Attestation cryptographique SLSA
      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          # On cible le(s) fichier(s) produit(s) à l'étape précédente
          subject-path: 'dist/*'

      # 3. On sauvegarde l'artefact ET son attestation cryptographique
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-coder-secure-build
          path: dist/
