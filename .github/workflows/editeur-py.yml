SKIP_DIRS = ("node_modules", ".git", "__pycache__", ".venv", ".idea", ".vscode")



def safe_path(rel):

    """Bloque la traversée de dossiers."""

    if not rel or rel.startswith("/") or ".." in rel.split("/"):

        return None

    try:

        target = (WORKSPACE / rel).resolve()

        target.relative_to(WORKSPACE.resolve())

        return target

    except (ValueError, OSError):

        return None



def get_files():

    files = []

    try:

        for item in sorted(WORKSPACE.rglob("*")):

            if any(p in item.parts for p in SKIP_DIRS):

                continue

            rel = str(item.relative_to(WORKSPACE))

            if rel.startswith("."):

                continue

            files.append({"name": item.name, "path": rel, "is_dir": item.is_dir()})

    except Exception:

        pass

    return files



class Handler(http.server.BaseHTTPRequestHandler):

    def log_message(self, *a):

        pass



    def _json(self, code, data):

        try:

            body = json.dumps(data, ensure_ascii=False, default=str).encode("utf-8")

            self.send_response(code)

            self.send_header("Content-Type", "application/json; charset=utf-8")

            self.send_header("Content-Length", str(len(body)))

            self.send_header("Access-Control-Allow-Origin", "*")

            self.end_headers()

            self.wfile.write(body)

        except Exception:

            pass



    def _html(self, html):

        try:

            body = html.encode("utf-8")

            self.send_response(200)

            self.send_header("Content-Type", "text/html; charset=utf-8")

            self.send_header("Content-Length", str(len(body)))

            self.end_headers()

            self.wfile.write(body)

        except Exception:

            pass



    def _read_json(self):

        try:

            n = int(self.headers.get("Content-Length", "0"))

            return json.loads(self.rfile.read(n).decode()) if n else {}

        except Exception:

            return {}



    def do_GET(self):

        parsed = urllib.parse.urlparse(self.path)

        path = parsed.path

        qs = urllib.parse.parse_qs(parsed.query)



        if path in ("/", "/index.html"):

            html = (HTML_PAGE

                    .replace("__PORT__", str(PORT))

                    .replace("__WORKSPACE__", str(WORKSPACE)))

            self._html(html)

            return



        if path == "/api/files":

            self._json(200, {"files": get_files()})

            return



        if path == "/api/read":

            rel = qs.get("path", [""])[0]

            target = safe_path(rel)

            if not target or not target.exists() or target.is_dir():

                self._json(404, {"error": "not_found"})

                return

            try:

                content = target.read_text(encoding="utf-8", errors="replace")

                self._json(200, {"path": rel, "content": content, "size": target.stat().st_size})

            except Exception as e:

                self._json(500, {"error": str(e)})

            return



        if path == "/health":

            self._json(200, {"ok": True, "version": VERSION, "port": PORT,

                             "workspace": str(WORKSPACE)})

            return



        self._json(404, {"error": "not_found"})



    def do_POST(self):

        path = urllib.parse.urlparse(self.path).path

        body = self._read_json()



        if path == "/api/save":

            rel = body.get("path", "")

            target = safe_path(rel)

            if not target:

                self._json(400, {"error": "invalid_path"})

                return

            try:

                target.parent.mkdir(parents=True, exist_ok=True)

                target.write_text(body.get("content", ""), encoding="utf-8")

                self._json(200, {"ok": True, "path": rel})

            except Exception as e:

                self._json(500, {"error": str(e)})

            return



        if path == "/api/folder":

            rel = body.get("path", "")

            target = safe_path(rel)

            if not target:

                self._json(400, {"error": "invalid_path"})

                return

            try:

                target.mkdir(parents=True, exist_ok=True)

                self._json(200, {"ok": True})

            except Exception as e:

                self._json(500, {"error": str(e)})

            return



        if path == "/api/delete":

            rel = body.get("path", "")

            target = safe_path(rel)

            if not target or not target.exists():

                self._json(404, {"error": "not_found"})

                return

            try:

                if target.is_dir():

                    shutil.rmtree(target)

                else:

                    target.unlink()

                self._json(200, {"ok": True})

            except Exception as e:

                self._json(500, {"error": str(e)})

            return



        self._json(404, {"error": "not_found"})



class Server(socketserver.ThreadingMixIn, http.server.HTTPServer):

    daemon_threads = True

    allow_reuse_address = True



