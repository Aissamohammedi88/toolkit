<script>

"use strict";

const $ = id => document.getElementById(id);

const editor = $('editor'), gutter = $('gutter'), gutterInner = $('gutter-inner'), frame = $('preview-frame');



const state = {

  files: [], current: null, dirty: false, savedContent: '',

  live: true, previewTimer: null, draftTimer: null

};



/* ══════════════ Utilitaires UI ══════════════ */



function toast(msg, type){

  const t = $('toast');

  t.textContent = msg;

  t.className = 'toast ' + (type || 'ok');

  t.style.display = 'block';

  clearTimeout(window._tt);

  window._tt = setTimeout(() => { t.style.display = 'none'; }, 2800);

}



function ask(title, label, def){

  return new Promise(resolve => {

    $('modal-title').textContent = title;

    $('modal-label').textContent = label;

    const inp = $('modal-input');

    inp.value = def || '';

    const done = v => { closeModal(); resolve(v); };

    $('modal-ok').onclick = () => done(inp.value.trim() || null);

    $('modal-cancel').onclick = () => done(null);

    inp.onkeydown = e => {

      if (e.key === 'Enter') done(inp.value.trim() || null);

      if (e.key === 'Escape') done(null);

    };

    $('modal').classList.add('show');

    setTimeout(() => { inp.focus(); inp.select(); }, 60);

  });

}

function closeModal(){ $('modal').classList.remove('show'); }



/* ══════════════ API ══════════════ */



async function api(url, method, body){

  try {

    const opts = { method: method || 'GET', headers: { 'Content-Type': 'application/json' } };

    if (body) opts.body = JSON.stringify(body);

    const r = await fetch(url, opts);

    return await r.json();

  } catch (e) { return { error: e.message }; }

}



async function loadFiles(){

  const d = await api('/api/files');

  if (d.error) { toast(d.error, 'error'); return; }

  state.files = d.files || [];

  renderFiles();

}



function renderFiles(){

  const el = $('file-list');

  el.innerHTML = '';

  const items = state.files.filter(f => !f.is_dir && !f.name.startsWith('.'));

  if (!items.length) { el.innerHTML = '<div class="file-empty">Aucun fichier. Crée ton premier README.md !</div>'; return; }

  items.forEach(f => {

    const div = document.createElement('div');

    div.className = 'file-item' + (state.current === f.path ? ' active' : '');

    div.innerHTML = '<span class="fname">📄 ' + f.name + '</span><span class="del" title="Supprimer">✕</span>';

    div.onclick = () => openFile(f.path);

    div.querySelector('.del').onclick = ev => deleteFile(f.path, ev);

    el.appendChild(div);

  });

}



async function openFile(path, skipConfirm){

  if (state.dirty && !skipConfirm && !confirm('Modifications non sauvegardées. Ouvrir quand même ?')) return;

  const d = await api('/api/read?path=' + encodeURIComponent(path));

  if (d.error) { toast(d.error, 'error'); return; }

  state.current = path;

  editor.value = d.content || '';

  state.savedContent = editor.value;

  state.dirty = false;

  updateSaved(); onEdit();

  document.title = path + ' — MD STUDIO';

  renderFiles();

  refreshPreview();

  checkDraft();

}



async function newFile(){

  const name = await ask('Nouveau fichier', 'Nom (ex : README.md)', 'README.md');

  if (!name) return;

  const d = await api('/api/save', 'POST', { path: name, content: '' });

  if (d.error) { toast(d.error, 'error'); return; }

  await loadFiles();

  openFile(name, true);

}



async function saveFile(saveAs){

  let path = state.current;

  if (saveAs || !path) {

    path = await ask('Enregistrer sous', 'Nom du fichier', path || 'README.md');

    if (!path) return;

  }

  const d = await api('/api/save', 'POST', { path: path, content: editor.value });

  if (d.error) { toast(d.error, 'error'); return; }

  state.current = path;

  state.savedContent = editor.value;

  state.dirty = false;

  localStorage.removeItem('draft:' + path);

  updateSaved(); renderFiles();

  toast('✅ Sauvegardé : ' + path, 'ok');

  document.title = path + ' — MD STUDIO';

}



async function deleteFile(path, ev){

  ev.stopPropagation();

  if (!confirm('Supprimer ' + path + ' ?')) return;

  const d = await api('/api/delete', 'POST', { path: path });

  if (d.error) { toast(d.error, 'error'); return; }

  if (state.current === path) {

    state.current = null; editor.value = ''; state.savedContent = '';

    updateSaved(); onEdit(); refreshPreview();

  }

  toast('Supprimé : ' + path, 'ok');

  loadFiles();

}



/* ══════════════ État / stats ══════════════ */



function updateSaved(){

  $('saved-dot').className = 'dot' + (state.dirty ? ' dirty' : '');

  $('st-file').textContent = state.current || 'sans titre';

}



function updateStats(){

  const v = editor.value;

  const lines = v ? v.split('\n').length : 0;

  const words = v.trim() ? v.trim().split(/\s+/).length : 0;

  $('st-lines').textContent = lines + ' lignes';

  $('st-words').textContent = words + ' mots';

  $('st-chars').textContent = v.length + ' car.';

  $('st-read').textContent = words ? '~' + Math.max(1, Math.ceil(words / 200)) + ' min de lecture' : '';

}



function updateCursor(){

  const pos = editor.selectionStart;

  const before = editor.value.slice(0, pos);

  const ln = before.split('\n').length;

  const col = pos - before.lastIndexOf('\n');

  $('st-cursor').textContent = 'Ln ' + ln + ', Col ' + col;

}



function updateGutter(){

  const n = editor.value.split('\n').length;

  let h = '';

  for (let i = 1; i <= n; i++) h += i + '\n';

  gutterInner.textContent = h;

}



function onEdit(){

  state.dirty = editor.value !== state.savedContent;

  updateSaved(); updateStats(); updateGutter(); updateCursor();

  schedulePreview(); scheduleDraft();

}



function scheduleDraft(){

  clearTimeout(state.draftTimer);

  state.draftTimer = setTimeout(() => {

    if (state.current && state.dirty) localStorage.setItem('draft:' + state.current, editor.value);

  }, 2000);

}



function checkDraft(){

  if (!state.current) return;

  const d = localStorage.getItem('draft:' + state.current);

  if (d && d !== editor.value && confirm('Brouillon local trouvé (non sauvegardé). Le restaurer ?')) {

    editor.value = d; onEdit(); refreshPreview();

  }

}



/* ══════════════ Insertion / toolbar ══════════════ */



function insert(text){

  const s = editor.selectionStart;

  editor.setRangeText(text, s, editor.selectionEnd, 'end');

  editor.focus(); onEdit();

}



function wrap(before, after, placeholder){

  const s = editor.selectionStart, e = editor.selectionEnd;

  const sel = editor.value.slice(s, e);

  if (!sel) {

    insert(before + placeholder + after);

    const p = s + before.length;

    editor.setSelectionRange(p, p + placeholder.length);

  } else {

    editor.setRangeText(before + sel + after, s, e, 'select');

    editor.setSelectionRange(s + before.length, e + before.length);

  }

  editor.focus(); onEdit();

}



function prefix(p){

  const s = editor.selectionStart, e = editor.selectionEnd;

  const before = editor.value.slice(0, s);

  const sel = editor.value.slice(s, e) || ('ligne ' + p.trim());

  const after = editor.value.slice(e);

  const replaced = sel.split('\n').map(l => p + l).join('\n');

  editor.value = before + replaced + after;

  editor.setSelectionRange(s, s + replaced.length);

  editor.focus(); onEdit();

}



async function insertTable(){

  const rows = await ask('Tableau', 'Lignes (hors en-tête)', '3');

  if (rows === null) return;

  const cols = await ask('Tableau', 'Colonnes', '3');

  if (cols === null) return;

  const R = Math.min(50, Math.max(1, parseInt(rows) || 1));

  const C = Math.min(12, Math.max(1, parseInt(cols) || 1));

  let md = '\n| ' + Array(C).fill('En-tête').join(' | ') + ' |\n';

  md += '|' + Array(C).fill(' --- ').join('|') + '|\n';

  for (let i = 0; i < R; i++) md += '|' + Array(C).fill(' ').join('|') + '|\n';

  insert(md + '\n');

}



const actions = {

  bold:   () => wrap('**', '**', 'gras'),

  italic: () => wrap('*', '*', 'italique'),

  strike: () => wrap('~~', '~~', 'barré'),

  code:   () => wrap('`', '`', 'code'),

  codeblock: () => wrap('\n```\n', '\n```\n', 'console.log(42)'),

  h1: () => prefix('# '),

  h2: () => prefix('## '),

  h3: () => prefix('### '),

  quote: () => prefix('> '),

  ul:   () => prefix('- '),

  ol:   () => prefix('1. '),

  task: () => prefix('- [ ] '),

  hr:   () => insert('\n---\n'),

  link: async () => {

    const url = await ask('Lien', 'URL', 'https://');

    if (url === null) return;

    wrap('[', '](' + url + ')', 'texte du lien');

  },

  image: async () => {

    const url = await ask('Image', 'URL de l\u2019image', 'https://');

    if (url === null) return;

    insert('![alt](' + url + ')');

  },

  table: insertTable

};



/* ══════════════ Sommaire ══════════════ */



function slug(s){

  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')

    .replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-+|-+$/g, '');

}



function insertToc(){

  const items = [];

  editor.value.split('\n').forEach(l => {

    const m = l.match(/^(#{1,3})\s+(.+)/);

    if (m) items.push({ level: m[1].length, text: m[2].trim().replace(/#+$/, '').trim() });

  });

  if (!items.length) { toast('Aucun titre trouvé', 'error'); return; }

  let md = '\n## 📑 Sommaire\n\n';

  items.forEach(it => { md += '  '.repeat(it.level - 1) + '- [' + it.text + '](#' + slug(it.text) + ')\n'; });

  insert(md + '\n');

}



/* ══════════════ Moteur Markdown (GFM subset) ══════════════ */



function escapeHtml(s){

  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

}



function inline(text){

  const codes = [];

  text = text.replace(/`([^`]+)`/g, (m, c) => {

    codes.push('<code>' + c + '</code>');

    return '\u0001' + (codes.length - 1) + '\u0001';

  });

  text = escapeHtml(text);

  text = text.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"([^"]*)")?\)/g,

    (m, alt, url, t) => '<img src="' + url + '" alt="' + alt + '"' + (t ? ' title="' + t + '"' : '') + ' loading="lazy">');

  text = text.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+"([^"]*)")?\)/g,

    (m, t, url, ti) => '<a href="' + url + '"' + (ti ? ' title="' + ti + '"' : '') + ' target="_blank" rel="noopener">' + t + '</a>');

  text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

  text = text.replace(/__([^_]+)__/g, '<strong>$1</strong>');

  text = text.replace(/~~([^~]+)~~/g, '<del>$1</del>');

  text = text.replace(/\*([^*\n]+)\*/g, '<em>$1</em>');

  text = text.replace(/(^|[^A-Za-z0-9_])_([^_\n]+)_(?![A-Za-z0-9_])/g, '$1<em>$2</em>');

  text = text.replace(/\u0001(\d+)\u0001/g, (m, i) => codes[+i]);

  return text;

}



function renderMarkdown(src){

  const lines = src.replace(/\r\n?/g, '\n').split('\n');

  const out = [];

  let i = 0;

  const isSep = l => l.indexOf('|') > -1 && l.indexOf('-') > -1 && /^\s*\|?[\s:\-|]+\|?\s*$/.test(l);

  const blockStart = (l, j) =>

    /^```/.test(l) || /^#{1,6}\s/.test(l) ||

    /^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(l) ||

    /^\s*>/.test(l) || /^\s*([-*+]|\d+\.)\s+/.test(l) ||

    (l.indexOf('|') > -1 && j + 1 < lines.length && isSep(lines[j + 1])) ||

    /^\s*<[a-zA-Z\/!]/.test(l);



  while (i < lines.length) {

    const line = lines[i];

    if (/^\s*$/.test(line)) { i++; continue; }



    // Bloc HTML brut

    if (/^\s*<[a-zA-Z\/!]/.test(line)) {

      const buf = [];

      while (i < lines.length && !/^\s*$/.test(lines[i])) { buf.push(lines[i]); i++; }

      out.push(buf.join('\n'));

      continue;

    }



    // Bloc de code ```

    let m = line.match(/^```(\w*)\s*$/);

    if (m) {

      const lang = m[1], buf = [];

      i++;

      while (i < lines.length && !/^```\s*$/.test(lines[i])) { buf.push(lines[i]); i++; }

      i++;

      out.push('<pre class="cb"><code>' + escapeHtml(buf.join('\n')) + '</code></pre>');

      continue;

    }



    // Titres

    m = line.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/);

    if (m) {

      const lvl = m[1].length;

      const id = lvl <= 3 ? ' id="' + slug(m[2]) + '"' : '';

      out.push('<h' + lvl + id + '>' + inline(m[2]) + '</h' + lvl + '>');

      i++; continue;

    }



    // Séparateur

    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { out.push('<hr>'); i++; continue; }



    // Citation

    if (/^\s*>/.test(line)) {

      const buf = [];

      while (i < lines.length && /^\s*>/.test(lines[i])) { buf.push(lines[i].replace(/^\s*>\s?/, '')); i++; }

      out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');

      continue;

    }



    // Tableau

    if (line.indexOf('|') > -1 && i + 1 < lines.length && isSep(lines[i + 1])) {

      const split = l => l.trim().replace(/^\|/, '').replace(/\|\s*$/, '').split('|');

      const head = split(line); i += 2;

      const rows = [];

      while (i < lines.length && lines[i].indexOf('|') > -1 && !/^\s*$/.test(lines[i])) { rows.push(split(lines[i])); i++; }

      let h = '<div class="tw"><table><thead><tr>' + head.map(c => '<th>' + inline(c.trim()) + '</th>').join('') + '</tr></thead><tbody>';

      h += rows.map(r => '<tr>' + r.map(c => '<td>' + inline(c.trim()) + '</td>').join('') + '</tr>').join('');

      h += '</tbody></table></div>';

      out.push(h); continue;

    }



    // Listes (puces / numérotées / tâches, imbrication simple)

    m = line.match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/);

    if (m) {

      const base = m[1].length;

      const items = [];

      while (i < lines.length) {

        const mm = lines[i].match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/);

        if (!mm) break;

        if (mm[1].length > base) {

          if (items.length) items[items.length - 1].sub.push(mm[3]);

          i++; continue;

        }

        items.push({ t: mm[3], o: /^\d/.test(mm[2]), sub: [] });

        i++;

      }

      const renderItems = list =>

        '<' + (list.some(x => x.o) ? 'ol' : 'ul') + '>' + list.map(x => {

          let t = inline(x.t)

            .replace(/^\[ \]\s*/, '<input type="checkbox" disabled> ')

            .replace(/^\[[xX]\]\s*/, '<input type="checkbox" checked disabled> ');

          let s = '<li>' + t;

          if (x.sub.length) s += renderItems(x.sub.map(y => ({ t: y, o: false, sub: [] })));

          return s + '</li>';

        }).join('') + '</' + (list.some(x => x.o) ? 'ol' : 'ul') + '>';

      out.push(renderItems(items)); continue;

    }



    // Paragraphe

    const para = [];

    while (i < lines.length && !/^\s*$/.test(lines[i]) && !blockStart(lines[i], i)) { para.push(lines[i]); i++; }

    if (para.length) out.push('<p>' + inline(para.join('\n')).replace(/\n/g, '<br>') + '</p>');

    else i++;

  }

  return out.join('\n');

}



