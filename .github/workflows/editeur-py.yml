}



function schedulePreview(){

  if (!state.live) return;

  clearTimeout(state.previewTimer);

  state.previewTimer = setTimeout(refreshPreview, 250);

}



function refreshPreview(){

  const max = editor.scrollHeight - editor.clientHeight;

  const ratio = max > 0 ? editor.scrollTop / max : 0;

  frame.onload = () => {

    try {

      const d = frame.contentDocument.documentElement;

      d.scrollTop = ratio * (d.scrollHeight - d.clientHeight);

    } catch (e) {}

  };

  frame.srcdoc = buildPreviewDoc();

}



$('live-toggle').addEventListener('change', e => {

  state.live = e.target.checked;

  if (state.live) refreshPreview();

});



