name: "🏰 Supply Chain Fortress"

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write # CRUCIAL : pour OIDC (Cosign keyless + SLSA)
  security-events: write
  pull-requests: write

concurrency:
  group: "fortress-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ═══════════════════════════════════════════════════════════════
  # JOB 1 : DÉTECTION DYNAMIQUE DES COMPOSANTS MODIFIÉS
  # ═══════════════════════════════════════════════════════════════
  detect:
    name: "🔍 Detect Changed Components"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: set
        name: "Build Matrix JSON"
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -E '^(apps|packages|services)/[^/]+/' | cut -d/ -f2 | sort -u || true)
          else
            CHANGED=$(git diff --name-only HEAD~1 | grep -E '^(apps|packages|services)/[^/]+/' | cut -d/ -f2 | sort -u || true)
          fi
          
          if [ -z "$CHANGED" ]; then
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
          else
            JSON=$(printf '%s\n' "$CHANGED" | jq -R -s -c 'split("\n") | map(select(length>0)) | {include: map({component: .})}')
            echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
          fi
  # ═══════════════════════════════════════════════════════════════
  # JOB 2 : BUILD + SBOM + SCAN + SIGN + ATTEST (par composant)
  # ═══════════════════════════════════════════════════════════════
  fortress:
    name: "🛡️ Fortress (${{ matrix.component }})"
    needs: detect
    if: needs.detect.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      # ─── BUILD ───
      - name: "Build Docker Image"
        run: |
          docker build -t ${{ github.repository }}/${{ matrix.component }}:${{ github.sha }} \
            ./apps/${{ matrix.component }} || \
          docker build -t ${{ github.repository }}/${{ matrix.component }}:${{ github.sha }} \
            ./packages/${{ matrix.component }} || \
          docker build -t ${{ github.repository }}/${{ matrix.component }}:${{ github.sha }} \
            ./services/${{ matrix.component }}

      # ─── SBOM avec Syft ───
      - name: "Generate SBOM (Syft)"
        uses: anchore/sbom-action@v0.24
        with:
          image: ${{ github.repository }}/${{ matrix.component }}:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.component }}.cdx.json
          upload-artifact: false

      # ─── SCAN de vulnérabilités avec Grype ───
      - name: "Scan SBOM for CVEs (Grype)"
        uses: anchore/scan-action@v4
        with:
          sbom: sbom-${{ matrix.component }}.cdx.json
          fail-build: true
          severity-cutoff: high
          output-format: sarif

      - name: "Upload Grype SARIF"
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: grype-${{ matrix.component }}
      # ─── SCAN de vulnérabilités avec Trivy (redondance) ───
      - name: "Scan Image with Trivy"
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ github.repository }}/${{ matrix.component }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.component }}.sarif
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
      - name: "Upload Trivy SARIF"
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.component }}.sarif
          category: trivy-${{ matrix.component }}
      # ─── SIGNATURE avec Cosign (keyless OIDC) ───
      - name: "Install Cosign"
        uses: sigstore/cosign-installer@v4

     
