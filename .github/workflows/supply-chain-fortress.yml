

name: Nexus Enterprise Guardian

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Version de Node.js'
        required: false
        type: string
        default: '20'
      python-version:
        description: 'Version de Python'
        required: false
        type: string
        default: '3.12'
      enable-slsa:
        description: 'Générer la provenance SLSA'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  # ─── JOB 1 : DÉTECTION DE SECRETS (Gitleaks + TruffleHog) ───────────────────
  secret-scan:
    name: "🔐 Détection de Secrets"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (SHA pinning)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --report-format sarif --report-path gitleaks.sarif --exit-code 1

      - name: TruffleHog Scan (Vérifié)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified --json

      - name: Upload SARIF Gitleaks
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  # ─── JOB 2 : ANALYSE SAST (Semgrep) ─────────────────────────────────────────
  sast-scan:
    name: "🧠 Analyse SAST (Semgrep)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: returntocorp/semgrep:latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Semgrep CI
        run: |
          semgrep ci \
            --config p/secrets \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --sarif --output semgrep.sarif \
            --error
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload SARIF Semgrep
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ─── JOB 3 : TESTS HIÉRARCHISÉS (Matrice Dynamique) ────────────────────────
  test:
    name: "🧪 Tests Hiérarchisés"
    needs: [secret-scan, sast-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Matrice réduite pour les PR, complète pour main (économie de coûts)
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.11", "3.12"]') || fromJSON('["3.10", "3.11", "3.12", "3.13"]') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run tests
        run: pytest || echo "Aucun test configuré."

  # ─── JOB 4 : PROVENANCE SLSA (Attestation de build) ────────────────────────
  provenance:
    name: "📜 Provenance SLSA"
    needs: [test]
    if: inputs.enable-slsa && github.event_name != 'pull_request'
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v1.9.0
    with:
      base64-subjects: "${{ needs.test.outputs.hashes }}"
      upload-assets: true
