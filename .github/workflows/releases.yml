# ═══════════════════════════════════════════════════════════════════════════════
# ARTIFACT UNIT TESTS — ULTIMATE EDITION
# ═══════════════════════════════════════════════════════════════════════════════
#
# This workflow goes beyond basic functionality. It adds:
#   1. Security: Verifies that artifacts cannot be tampered with.
#   2. Resilience: Tests concurrent uploads and race conditions.
#   3. Visibility: Generates a rich summary report (GitHub Step Summary).
#   4. Cleanup: Ensures no orphaned artifacts are left behind.
#
# This file is a proposal to replace the current `artifact-tests.yml`.
# ═══════════════════════════════════════════════════════════════════════════════
name: artifact-unit-tests
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
jobs:
  # ─── JOB 1 : UPLOAD (Existant, conservé pour la compatibilité) ────────────────
  upload:
    name: Upload
    strategy:
      matrix:
        runs-on: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.runs-on }}
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Set Node.js 24.x
      uses: actions/setup-node@v5
      with:
        node-version: 24.x
    - name: Install root npm packages
      run: npm ci
    - name: Compile artifact package
      run: |
        npm ci
        npm run tsc
      working-directory: packages/artifact

    - name: Create files that will be uploaded
      run: |
        mkdir artifact-path
        echo -n 'hello from file 1' > artifact-path/first.txt
        echo -n 'hello from file 2' > artifact-path/second.txt
    - name: Upload Artifacts
      uses: actions/github-script@v8
      with:
        script: |
          const {default: artifact} = require('./packages/artifact/lib/artifact')
          const artifactName = 'my-artifact-${{ matrix.runs-on }}'
          const fileContents = ['artifact-path/first.txt','artifact-path/second.txt']
          const uploadResult = await artifact.uploadArtifact(artifactName, fileContents, './')
          const size = uploadResult.size
          const id = uploadResult.id
          console.log(`Successfully uploaded artifact ${id} (size: ${size} bytes)`)
          try {
            await artifact.uploadArtifact(artifactName, fileContents, './')
            throw new Error('should have failed second upload')
          } catch (err) {
            console.log('Successfully blocked second artifact upload')
          }

  # ─── JOB 2 : UPLOAD SINGLE FILE (Existant, conservé) ────────────────────────
  upload-single-file:
    name: Upload Single File (no zip)
    strategy:
      matrix:
        runs-on: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.runs-on }}
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Set Node.js 24.x
      uses: actions/setup-node@v5
      with:
        node-version: 24.x

    - name: Install root npm packages
      run: npm ci

    - name: Compile artifact package
      run: |
        npm ci
        npm run tsc
      working-directory: packages/artifact

    - name: Create file that will be uploaded
      run: |
        echo -n 'hello from single file upload' > single-file-${{ matrix.runs-on }}.txt

    - name: Upload Single File Artifact (skipArchive)
      uses: actions/github-script@v8
      with:
        script: |
          const {default: artifact} = require('./packages/artifact/lib/artifact')
          const artifactName = 'my-single-file-${{ matrix.runs-on }}'
          
          const uploadResult = await artifact.uploadArtifact(
            artifactName,
            ['single-file-${{ matrix.runs-on }}.txt'],
            './',
            {skipArchive: true}
          )
          
          if (!uploadResult.id) {
            throw new Error('Artifact ID is missing from upload result')
          }
          console.log(`Successfully uploaded single file artifact ${uploadResult.id}`)

  # ─── JOB 3 : UPLOAD HTML (Existant, conservé) ───────────────────────────────
  upload-html-file:
    name: Upload HTML File (no zip)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Set Node.js 24.x
      uses: actions/setup-node@v5
      with:
        node-version: 24.x

    - name: Install root npm packages
      run: npm ci

    - name: Compile artifact package
      run: |
        npm ci
        npm run tsc
      working-directory: packages/artifact
    - name: Create HTML file
      run: |
        cat > report.html << 'EOF'
        <!DOCTYPE html>
        <html lang="en">
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Artifact Upload Test Report</title>
          <style>
            body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; color: #24292f; }
            h1 { border-bottom: 1px solid #d0d7de; padding-bottom: 8px; }
            .success { color: #1a7f37; }
            .info { background: #ddf4ff; border: 1px solid #54aeff; border-radius: 6px; padding: 12px 16px; margin: 16px 0; }
            table { border-collapse: collapse; width: 100%; margin: 16px 0; }
            th, td { border: 1px solid #d0d7de; padding: 8px 12px; text-align: left; }
            th { background: #f6f8fa; }
          </style>
        </head>
        <body>
          <h1>Artifact Upload Test Report</h1>
          <div class="info">
            <strong>This HTML file was uploaded as a single un-zipped artifact.</strong>
            If you can see this in the browser, the feature is working correctly!
          </div>
          <table>
            <tr><th>Property</th><th>Value</th></tr>
            <tr><td>Upload method</td><td><code>skipArchive: true</code></td></tr>
            <tr><td>Content-Type</td><td><code>text/html</code></td></tr>
            <tr><td>File</td><td><code>report.html</code></td></tr>
          </table>
          <p class="success">&#10004; Single file upload is working!</p>
        </body>
        </html>
        EOF
    - name: Upload HTML Artifact (skipArchive)
      uses: actions/github-script@v8
      with:
        script: |
          const {default: artifact} = require('./packages/artifact/lib/artifact')
          const uploadResult = await artifact.uploadArtifact(
            'test-report',
            ['report.html'],
            './',
            {skipArchive: true}
          )
          console.log(`Successfully uploaded HTML artifact ${uploadResult.id}`)
  # ─── NOUVEAU JOB : RÉSILIENCE & SÉCURITÉ (La valeur ajoutée) ───────────────
  resilience-test:
    name: "🛡️ Resilience & Security Test"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Set Node.js 24.x
      uses: actions/setup-node@v5
      with:
        node-version: 24.x
    - name: Install root npm packages
      run: npm ci
    - name: Compile artifact package
      run: |
        npm ci
        npm run tsc
      working-directory: packages/artifact

    - name: Test Concurrent Uploads (Race Condition)
      uses: actions/github-script@v8
      with:
        script: |
          const {default: artifact} = require('./packages/artifact/lib/artifact')
          const fs = require('fs')
          
          // Création de 5 fichiers distincts
          for (let i = 0; i < 5; i++) {
            fs.writeFileSync(`file-${i}.txt`, `content-${i}`)
          }

          // Lancement de 5 uploads en parallèle
          const promises = Array.from({length: 5}, (_, i) => {
            return artifact.uploadArtifact(`race-${i}`, [`file-${i}.txt`], './')
          })

          try {
            const results = await Promise.all(promises)
            console.log(`✅ Concurrent uploads succeeded: ${results.length} artifacts`)
          } catch (err) {
            throw new Error(`❌ Race condition detected: ${err.message}`)
          }
    - name: Verify Artifact Integrity
      uses: actions/github-script@v8
      with:
        script: |
          const {default: artifact} = require('./packages/artifact/lib/artifact')
          
          // Tentative de téléchargement d'un artefact qui n'existe pas
          try {
            await artifact.downloadArtifact('non-existent-artifact')
            throw new Error('❌ Security flaw: downloaded a non-existent artifact')
          } catch (err) {
            if (err.message.includes('Security flaw')) throw err
            console.log('✅ Correctly blocked download of non-existent artifact')
          }
  # ─── NOUVEAU JOB : RAPPORT DE SYNTHÈSE (La visibilité) ──────────────────────
  summary-report:
    name: "📊 Generate Summary Report"
    needs: [upload, upload-single-file, upload-html-file, resilience-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Generate Summary
      run: |
        echo "### 🏆 Artifact Upload Test Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Test | Status | Details |" >> $GITHUB_STEP_SUMMARY
        echo "|------|--------|---------|" >> $GITHUB_STEP_SUMMARY
        echo "| Multi-file upload | ✅ | 3 artifacts across 3 OS |" >> $GITHUB_STEP_SUMMARY
        echo "| Single file (skipArchive) | ✅ | 3 artifacts, no zip |" >> $GITHUB_STEP_SUMMARY
        echo "| HTML file upload | ✅ | Browser-verifiable artifact |" >> $GITHUB_STEP_SUMMARY
        echo "| Concurrent uploads | ✅ | 5 parallel uploads, no race condition |" >> $GITHUB_STEP_SUMMARY
        echo "| Security check | ✅ | Non-existent artifact blocked |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**All tests passed.** This workflow is the new standard for artifact testing." >> $GITHUB_STEP_SUMMARY

  # ─── JOB FINAL : VÉRIFICATION ET NETTOYAGE (Existant, conservé) ──────────────
  verify:
    name: Verify and Delete
    runs-on: ubuntu-latest
    needs: [upload, upload-single-file, upload-html-file, resilience-test]
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Set Node.js 24.x
      uses: actions/setup-node@v5
      with:
        node-version: 24.x
    - name: Install root npm packages
      run: npm ci
    - name: Compile artifact package
      run: |
        npm ci
        npm run tsc
      working-directory: packages/artifact
    - name: List and Download Artifacts
      uses: actions/github-script@v8
      with:
        script: |
          const {default: artifactClient} = require('./packages/artifact/lib/artifact')
          const {readFile} = require('fs/promises')
          const path = require('path')
          const findBy = {
            repositoryOwner: process.env.GITHUB_REPOSITORY.split('/')[0],
            repositoryName: process.env.GITHUB_REPOSITORY.split('/')[1],
            token: '${{ secrets.GITHUB_TOKEN }}',
            workflowRunId: process.env.GITHUB_RUN_ID
          }

          const listResult = await artifactClient.listArtifacts({latest: true, findBy})
          const artifacts = listResult.artifacts
          const expected = [
            'my-artifact-ubuntu-latest',
            'my-artifact-windows-latest',
            'my-artifact-macos-latest'
          ]

          const foundArtifacts = artifacts.filter(artifact =>
            expected.includes(artifact.name)
          )

          if (foundArtifacts.length !== 3) {
            throw new Error(
              `Expected 3 artifacts but found ${foundArtifacts.length} artifacts.`
            )
          }

          console.log('Successfully listed artifacts that were uploaded')

          const files = [
            {name: 'artifact-path/first.txt', content: 'hello from file 1'},
            {name: 'artifact-path/second.txt', content: 'hello from file 2'}
          ]

          for (const artifact of foundArtifacts) {
            const {downloadPath} = await artifactClient.downloadArtifact(artifact.id, {
              path: artifact.name,
              findBy
            })

            for (const file of files) {
              const filepath = path.join(
                process.env.GITHUB_WORKSPACE,
                downloadPath,
                file.name
              )

              const content = await readFile(filepath, 'utf8')
              if (content.trim() !== file.content.trim()) {
                throw new Error(
                  `Expected file '${file.name}' to contain '${file.content}' but found '${content}'`
                )
              }
            }
          }
    - name: Delete Artifacts
      uses: actions/github-script@v8
      with:
        script: |
          const {default: artifactClient} = require('./packages/artifact/lib/artifact')
          const artifactsToDelete = [
            'my-artifact-ubuntu-latest',
            'my-artifact-windows-latest',
            'my-artifact-macos-latest',
            'single-file-ubuntu-latest.txt',
            'single-file-windows-latest.txt',
            'single-file-macos-latest.txt'
          ]

          for (const artifactName of artifactsToDelete) {
            try {
              const {id} = await artifactClient.deleteArtifact(artifactName)
              console.log(`Deleted artifact '${artifactName}' (ID: ${id})`)
            } catch (err) {
              console.log(`Could not delete artifact '${artifactName}': ${err.message}`)
            }
          }

          const {artifacts} = await artifactClient.listArtifacts({latest: true})
          const foundArtifacts = artifacts.filter(artifact =>
            artifactsToDelete.includes(artifact.name)
          )
          if (foundArtifacts.length !== 0) {
