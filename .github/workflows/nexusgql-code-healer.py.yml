# ═══════════════════════════════════════════════════════════════════════════════
# NEXUS CODE HEALER — Self-Healing Code Agent
# ═══════════════════════════════════════════════════════════════════════════════ 
# "Don't just find the bug. Offer the cure."
#
# This workflow analyzes code changes (YAML, Python, JS) and posts a comment
# with TWO distinct fixes: Option A (Performance/Minimal) and Option B (Safety/Readability).
      # ─── ÉTAPE 1 : SEMGREP ───────────────────────────────────────────────────
      - name: Run Semgrep
        # On autorise l'échec de cette étape pour que l'upload SARIF se fasse quand même
        continue-on-error: true
        run: |
          semgrep ci \
            --config p/secrets \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --sarif \
            --output semgrep.sarif \
            --error
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      # ─── ÉTAPE 2 : UPLOAD SARIF ──────────────────────────────────────────────
      - name: Upload SARIF
        # On force l'exécution même si l'étape précédente a échoué (code 1 = failles trouvées)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
          # NOTE: GitHub recommande de passer à v4 pour 2026, 
          # mais v3 reste fonctionnel pour l'instant.
          name: "Nexus Code Healer"
          on:
        pull_request:
         types: [opened, synchronize]
        paths:
      - '**.yml'
      - '**.yaml'
      - '**.py'
      - '**.js
      Poste le commentaire sur la Pull Request
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: suggestions
            });
