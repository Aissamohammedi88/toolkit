  SAST-Semgrep:
    name: "🛡️ SAST (Semgrep)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4      - name: Install Semgrep
        run: pip install semgrep
      - name: Run Semgrep Scan
        run: |
          # Le || true est CRUCIAL ici. Il permet au job de continuer même si Semgrep trouve des erreurs.
          semgrep scan \
            --config p/secrets \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --sarif \
            --output semgrep.sarif || true
          # On vérifie que le fichier a bien été créé
          if [ ! -f semgrep.sarif ]; then
            echo "::error::Semgrep n'a pas généré le fichier SARIF."
            exit 1  
            fi
      - name: Upload SARIF File
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: fi
