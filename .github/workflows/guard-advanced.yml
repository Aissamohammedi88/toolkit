# ═══════════════════════════════════════════════════════════════════════════════
# DEPENDENCY GUARD & AUTO-MERGE — NEXUS ULTRA
# ═══════════════════════════════════════════════════════════════════════════════
# Stratégie :
#   - Vérification des dépendances (CVE & Licences).
#   - Auto-merge conditionnel UNIQUEMENT pour Dependabot (Patch/Minor).
#   - Sécurité de la Supply Chain : Actions épinglées par SHA (Pinning).
# ═══════════════════════════════════════════════════════════════════════════════
name: "🛡️ Dependency Guard & Auto-Merge"
on:
  pull_request:
    branches: [ "main" ]
permissions:
  contents: read
  pull-requests: write
jobs:
  dependency-review:
    name: "🔍 Review Dependencies"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: "Dependency Review (Bloque les CVE)"
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0

  auto-merge:
    name: "🤖 Auto-Merge (si sain)"
    needs: [dependency-review]
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: "Fetch Dependabot Metadata"
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: "Auto-Merge (Patch/Minor uniquement)"
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: |
          gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
