# ═══════════════════════════════════════════════════════════════════════════════
# NEXUS SUPREME PIPELINE — ZERO FAILURE ARCHITECTURE
# ═══════════════════════════════════════════════════════════════════════════════
name: "🛡️ Nexus Supreme Pipeline"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  pull-requests: write
  security-events: write

concurrency:
  group: "supreme-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ─── JOB 1 : AUDIT DE SÉCURITÉ (Trivy + Dependency Review) ──────────────────
  security-audit:
    name: "🔍 Security Audit"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: "Trivy FS Scan (Vulnérabilités & Secrets)"
        uses: aquasecurity/trivy-action@0.32.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0' # 0 pour ne pas bloquer si faille trouvée, mais on upload le rapport
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'

      - name: "Dependency Review (Bloque CVE & Licences)"
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0

  # ─── JOB 2 : BUILD & VALIDATION (Auto-Adaptatif) ────────────────────────────
  build-and-validate:
    name: "🔨 Build & Validate"
    needs: security-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- DÉTECTION INTELLIGENTE DE PYTHON ---
      - name: Detect Python Requirements
        id: detect_python
        run: |
          if [ -f "requirements.txt" ]; then
            echo "path=requirements.txt" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          elif [ -f "pyproject.toml" ]; then
            echo "path=pyproject.toml" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            FOUND=$(find . -maxdepth 3 -name "requirements.txt" | head -n 1)
            if [ -n "$FOUND" ]; then
              echo "path=$FOUND" >> "$GITHUB_OUTPUT"
              echo "found=true" >> "$GITHUB_OUTPUT"
            else
              echo "found=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # Le cache n'est activé QUE si un fichier a été trouvé
          cache: ${{ steps.detect_python.outputs.found == 'true' && 'pip' || '' }}
          cache-dependency-path: ${{ steps.detect_python.outputs.path }}

      - name: Install Python Dependencies
        if: steps.detect_python.outputs.found == 'true'
        run: |
          python -m pip install --upgrade pip
          if [[ "${{ steps.detect_python.outputs.path }}" == *"pyproject.toml"* ]]; then
            pip install .
          else
            pip install -r "${{ steps.detect_python.outputs.path }}"
          fi

      - name: Run Python Tests
        if: steps.detect_python.outputs.found == 'true'
        run: |
          pip install pytest
          pytest || echo "Pas de tests configurés, on continue."

      # --- DÉTECTION INTELLIGENTE DE NODE.JS ---
      - name: Setup Node.js
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install & Build Node
        if: hashFiles('package.json') != ''
        run: |
          npm ci
          npm run build --if-present
          npm test --if-present
  # ─── JOB 3 : AUTO-MERGE (Dependabot uniquement) ─────────────────────────────
  auto-merge:
    name: "🤖 Auto-Merge (si sain)"
    needs: [security-audit, build-and-validate]
    if: github.actor == 'dependabot[bot]' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot Metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Auto-Merge (Patch/Minor)
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: |
          gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
