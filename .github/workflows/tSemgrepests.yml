  SAST-Semgrep:
    name: "🛡️ SAST (Semgrep)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Obligatoire pour uploader le SARIF

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Option 1 : L'action officielle (Recommandée, gère tout)
      - name: Run Semgrep (Official Action)
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/secrets
            p/security-audit
            p/owasp-top-ten
          generateSarif: "1"
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true # Permet de continuer pour uploader le SARIF

      - name: Upload SARIF File
        uses: github/codeql-action/upload-sarif@v3
        if: always() # S'exécute TOUJOURS, même si Semgrep a trouvé des failles
        with:
          sarif_file: semgrep.sarif
          category: semgrep
