name: "🔬 CodeQL Advanced Matrix"
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 3 * * 1' # Lundi à 03:00 UTC
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: "Analyze (${{ matrix.language }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        # On scanne TOUS les langages du projet, pas un seul.
        language: [ 'javascript-typescript', 'python', 'java-kotlin' ]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
      - name: "Setup Java (pour le scan Java)"
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@99b8673ff64fbf99d8d325f52d9cb1bae1056bd8 # v4.3.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: "Initialize CodeQL"
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: "Autobuild (Compilation)"
        uses: github/codeql-action/autobuild@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
      - name: "Analyze"
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: "/language:${{ matrix.language }}"
