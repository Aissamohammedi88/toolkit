name: artifact-unit-tests

on:
  push:
    branches: [ "main" ]
    paths-ignore: [ '**.md' ]
  pull_request:
    paths-ignore: [ '**.md' ]

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1 : Upload Multi-Fichiers (Matrix)
  # ═══════════════════════════════════════════════════════════════════════════
  upload:
    name: "Upload (${{ matrix.os }})"
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install & Compile
        run: |
          npm ci
          npm run tsc
        working-directory: packages/artifact

      - name: Create Files
        run: |
          mkdir -p artifact-path
          echo -n 'hello from file 1' > artifact-path/first.txt
          echo -n 'hello from file 2' > artifact-path/second.txt

      - name: Upload and Test Duplicate Block
        uses: actions/github-script@v7
        with:
          script: |
            const { default: artifact } = require('./packages/artifact/lib/artifact')
            const artifactName = `my-artifact-${{ matrix.os }}`
            const files = ['artifact-path/first.txt', 'artifact-path/second.txt']

            const result = await artifact.uploadArtifact(artifactName, files, './')
            console.log(`✓ Uploaded ${result.id} (${result.size} bytes)`)

            try {
              await artifact.uploadArtifact(artifactName, files, './')
              throw new Error('❌ Security flaw: Duplicate upload was allowed!')
            } catch (err) {
              if (err.message.includes('Security flaw')) throw err
              console.log('✓ Duplicate upload correctly blocked.')
            }
  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2 : Upload Fichier Unique (skipArchive)
  # ═══════════════════════════════════════════════════════════════════════════
  upload-single-file:
    name: "Upload Single File (${{ matrix.os }})"
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Install & Compile
        run: |
          npm ci
          npm run tsc
        working-directory: packages/artifact
      - name: Create Single File
        run: echo -n 'hello from single file upload' > single-file-${{ matrix.os }}.txt

      - name: Upload (skipArchive)
        uses: actions/github-script@v7
        with:
          script: |
            const { default: artifact } = require('./packages/artifact/lib/artifact')
            const artifactName = `my-single-file-${{ matrix.os }}`
            const file = `single-file-${{ matrix.os }}.txt`

            const result = await artifact.uploadArtifact(artifactName, [file], './', { skipArchive: true })
            if (!result.id) throw new Error('Missing artifact ID')
            console.log(`✓ Uploaded single file: ${result.id}`)

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 3 : Upload HTML (skipArchive)
  # ═══════════════════════════════════════════════════════════════════════════
  upload-html-file:
    name: "Upload HTML File"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Install & Compile
        run: |
          npm ci
          npm run tsc
        working-directory: packages/artifact
      - name: Create HTML
        run: |
          cat > report.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <title>Artifact Report</title>
            <style>
              body { font-family: system-ui; max-width: 800px; margin: 40px auto; color: #24292f; }
              .success { color: #1a7f37; font-weight: bold; }
            </style>
          </head>
          <body>
            <h1>Artifact Upload Test Report</h1>
            <p>Upload method: <code>skipArchive: true</code></p>
            <p class="success">✓ Single file upload is working!</p>
          </body>
          </html>
          EOF

      - name: Upload HTML
        uses: actions/github-script@v7
        with:
          script: |
            const { default: artifact } = require('./packages/artifact/lib/artifact')
            const result = await artifact.uploadArtifact('test-report', ['report.html'], './', { skipArchive: true })
            console.log(`✓ Uploaded HTML artifact: ${result.id}`)
  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 4 : Vérification et Nettoyage
  # ═══════════════════════════════════════════════════════════════════════════
  verify:
    name: "Verify & Cleanup"
    runs-on: ubuntu-latest
    needs: [ upload, upload-single-file, upload-html-file ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install & Compile
        run: |
          npm ci
          npm run tsc
        working-directory: packages/artifact

      - name: Verify Artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const { default: client } = require('./packages/artifact/lib/artifact')
            const { readFile } = require('fs/promises')
            const path = require('path')

            const findBy = {
              repositoryOwner: process.env.GITHUB_REPOSITORY.split('/')[0],
              repositoryName: process.env.GITHUB_REPOSITORY.split('/')[1],
              token: '${{ secrets.GITHUB_TOKEN }}',
              workflowRunId: process.env.GITHUB_RUN_ID
            }

            // 1. Vérifier les 3 artefacts multi-fichiers
            const { artifacts } = await client.listArtifacts({ latest: true, findBy })
            const expected = ['my-artifact-ubuntu-latest', 'my-artifact-windows-latest', 'my-artifact-macos-latest']
            const found = artifacts.filter(a => expected.includes(a.name))
            
            if (found.length !== 3) throw new Error(`Expected 3 multi-file artifacts, found ${found.length}`)
            console.log('✓ Multi-file artifacts count validated.')

            // 2. Vérifier les 3 artefacts mono-fichiers
            const expectedSingle = ['single-file-ubuntu-latest.txt', 'single-file-windows-latest.txt', 'single-file-macos-latest.txt']
            const foundSingle = artifacts.filter(a => expectedSingle.includes(a.name))
            
            if (foundSingle.length !== 3) throw new Error(`Expected 3 single-file artifacts, found ${foundSingle.length}`)
            console.log('✓ Single-file artifacts count validated.')

            // 3. Vérifier l'intégrité d'un fichier (échantillon)
            const sample = found[0]
            const { downloadPath } = await client.downloadArtifact(sample.id, { path: `dl-${sample.id}`, findBy })
            const content = await readFile(path.join(process.env.GITHUB_WORKSPACE, downloadPath, 'artifact-path/first.txt'), 'utf8')
            if (content.trim() !== 'hello from file 1') throw new Error('Content mismatch!')
            console.log(`✓ Content of ${sample.name} is valid.`)
      - name: Cleanup Artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const { default: client } = require('./packages/artifact/lib/artifact')
            const toDelete = [
              'my-artifact-ubuntu-latest', 'my-artifact-windows-latest', 'my-artifact-macos-latest',
              'single-file-ubuntu-latest.txt', 'single-file-windows-latest.txt', 'single-file-macos-latest.txt',
              'test-report'
            ]
            const { artifacts } = await client.listArtifacts({ latest: true })
            let deletedCount = 0

            for (const artifact of artifacts) {
              if (toDelete.includes(artifact.name)) {
                await client.deleteArtifact(artifact.name)
                deletedCount++
              }
            }
            console.log(`✓ Cleaned up ${deletedCount} artifacts.`)
            
            // Vérification finale : la liste doit être vide
            const { artifacts: remaining } = await client.listArtifacts({ latest: true })
            const leftovers = remaining.filter(a => toDelete.includes(a.name))
            if (leftovers.length > 0) throw new Error(`Cleanup failed. ${leftovers.length} artifacts remain.`)
            console.log('✓ All artifacts successfully purged.')
