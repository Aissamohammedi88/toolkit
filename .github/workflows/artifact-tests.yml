      - name: Run Semgrep SAST
        run: |
          # Installation de Semgrep
          pip install semgrep
          
          # Exécution du scan avec génération du fichier SARIF
          semgrep scan \
            --config p/secrets \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --sarif \
            --output semgrep.sarif \
            .
        continue-on-error: true # On continue même si Semgrep trouve des failles
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() # S'exécute même si l'étape précédente a échoué
        with:
          sarif_file: semgrep.sarif
          category: semgrep
