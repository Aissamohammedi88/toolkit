name: Recommendations
on:
push:
branches: [main, master]

jobs:
recommend:
runs-on: ubuntu-latest
permissions:
issues: write
steps:
- uses: actions/checkout@v4

- name: Generate recommendations
id: recs
run: |
RECS=""

[ -f "SECURITY.md" ] || RECS="$RECS\n- Ajouter SECURITY.md"
[ -f "LICENSE" ] || RECS="$RECS\n- Ajouter LICENSE"
[ -f "README.md" ] || RECS="$RECS\n- Ajouter README.md"
[ -f "CONTRIBUTING.md" ] || RECS="$RECS\n- Ajouter CONTRIBUTING.md"
[ -f "CODE_OF_CONDUCT.md" ] || RECS="$RECS\n- Ajouter CODE_OF_CONDUCT.md"
[ -f ".github/CODEOWNERS" ] || [ -f "CODEOWNERS" ] || RECS="$RECS\n- Ajouter CODEOWNERS"
[ -f ".github/dependabot.yml" ] || RECS="$RECS\n- Activer Dependabot"
[ -f ".github/pull_request_template.md" ] || RECS="$RECS\n- Ajouter template de PR"
[ -f ".github/ISSUE_TEMPLATE" ] || RECS="$RECS\n- Ajouter templates d'issues"
[ -d ".github/workflows" ] || RECS="$RECS\n- Ajouter workflows CI"

if [ -f Dockerfile ]; then
grep -q "^USER " Dockerfile || RECS="$RECS\n- Dockerfile : ajouter USER non-root"
grep -q ":latest" Dockerfile && RECS="$RECS\n- Dockerfile : éviter :latest"
grep -q "HEALTHCHECK" Dockerfile || RECS="$RECS\n- Dockerfile : ajouter HEALTHCHECK"
fi

echo "recommendations<<EOF" >> $GITHUB_OUTPUT
echo -e "$RECS" >> $GITHUB_OUTPUT
echo "EOF" >> $GITHUB_OUTPUT

- name: Create issue if recommendations
if: steps.recs.outputs.recommendations != ''
uses: actions/github-script@v7
with:
script: |
const recs = `${{ steps.recs.outputs.recommendations }}`;
if (!recs.trim()) return;

const title = '🔧 Recommandations Nexus Inspector';
const body = `## Recommandations automatiques\n\n${recs}\n\n---\n*Généré par Nexus Inspector*`;

// Vérifier si l'issue existe déjà
const issues = await github.rest.issues.listForRepo({
owner: context.repo.owner,
repo: context.repo.repo,
state: 'open',
labels: 'nexus-inspector'
});

const existing = issues.data.find(i => i.title === title);

if (existing) {
await github.rest.issues.update({
owner: context.repo.owner,
repo: context.repo.repo,
issue_number: existing.number,
body: body
});
} else {
await github.rest.issues.create({
owner: context.repo.owner,
repo: context.repo.repo,
title: title,
body: body,
labels: ['nexus-inspector', 'automated']
});
}
