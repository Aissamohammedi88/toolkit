# ────────────────────────────────────────────────────────────────────────────
#  Nexus Sovereign Audit & Auto-Heal — édition « sans erreur »
#
#  Pipeline : détection de stack → audit sécurité (Trivy/SARIF) → build & test
#  → auto-heal (PR de correctif si possible, issue sinon) → certificat souverain.
#
#  Règles appliquées dans cette version :
#   • Zéro interpolation ${{ }} à l'intérieur des scripts shell (anti-injection) :
#     tout transite par des variables d'environnement.
#   • Fichier attendu sous .github/workflows/nexus-sovereign-audit.yml
#     (sinon l'empreinte bascule automatiquement sur le fallback).
# ────────────────────────────────────────────────────────────────────────────
name: "Nexus Sovereign Audit & Auto-Heal"

on:
  push:
    branches: [ main, master ]
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  security-events: write
  issues: write

concurrency:
  group: nexus-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── JOB 1 : DÉTECTION DE STACK ────────────────────────────────────────────
  detect-stack:
    runs-on: ubuntu-latest
    outputs:
      languages: ${{ steps.detect.outputs.languages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Détecter les langages du dépôt
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          LANGS=()
          if [ -f Cargo.toml ]; then LANGS+=("rust"); fi
          if [ -f pyproject.toml ] || [ -f requirements.txt ] || [ -f setup.py ]; then LANGS+=("python"); fi
          if [ -f package.json ]; then LANGS+=("node"); fi
          if compgen -G '*.cob' > /dev/null || compgen -G '*.cbl' > /dev/null; then LANGS+=("cobol"); fi
          if [ "${#LANGS[@]}" -eq 0 ]; then LANGS+=("generic"); fi

          JSON='{"include":['
          SEP=''
          for ITEM in "${LANGS[@]}"; do
            JSON="${JSON}${SEP}{\"lang\":\"${ITEM}\"}"
            SEP=','
          done
          JSON="${JSON}]}"

          # Filet de sécurité : on ne publie que du JSON valide vers la matrice
          echo "$JSON" | jq -e . > /dev/null
           runs-on: ubuntu-latest
            steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with: {scan-type: fs, format: sarif, output: t.sarif, exit-code: '0'}
      - uses: github/codeql-action/upload-sarif@v3
        on-error: true
        with:{sarif_file: t.sarif}
      - run: echo "🛡️ Certificat Nexus — commit ${{ github.sha                                                 with:
      - sarifile: 'trivy-${{ matrix.lang }}.sarif'
       name: Avertir si l'audit a écho- if: 
     matrix:run: echo "::warning::L'audit Trivy a échoué pour '$STACK' — SARIF non publié
    needs: detect-stack
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-stack.outputs.languages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        if: matrix.lang == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build & Test Node
        if: matrix.lang == 'node'
        run: |
          set -euo pipefail
          # npm install (et non npm ci) : tolère l'absence de package-lock.json
          npm install --no-audit --no-fund
          # --if-present : pas d'erreur si les scripts build/test n'existent pas
          npm run build --if-present
          npm run test --if-present

      - name: Setup Python
        if: matrix.lang == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build & Test Python
        if: matrix.lang == 'python'
        run: |
          set -euo pipefail
          # Installation résiliente : un souci de deps n'échoue pas le job...
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt || echo "::warning::Installation requirements.txt partielle"
          elif [ -f pyproject.toml ]; then
            pip install . || echo "::warning::Installation pyproject.toml partielle"
          fi
          python -m pip install --quiet pytest
          # ...mais un échec RÉEL de test fait échouer le job
          # (sinon auto-heal ne se déclencherait jamais pour Python).
          if compgen -G 'test_*.py' > /dev/null || compgen -G 'tests/test_*.py' > /dev/null; then
            python -m pytest --tb=short
          else
            echo "::notice::Aucun test Python détecté — étape ignorée"
          fi

      - name: Build & Test Rust
        if: matrix.lang == 'rust'
        run: |
          set -euo pipefail
          cargo build --verbose
          cargo test --verbose

      - name: Stack sans build automatisé
        if: matrix.lang == 'generic' || matrix.lang == 'cobol'
        env:
          STACK: ${{ matrix.lang }}
        run: echo "::notice::Pas de build automatisé pour '$STACK' — détection seule"

  # ─── JOB 4 : AUTO-HEAL (correctifs réels, plus de PR fantôme) ───────────────
  auto-heal:
    needs: [detect-stack, build-test]
    # Pas sur les pull_request : GITHUB_TOKEN y est en lecture seule sur les
    # forks, et le heal a surtout du sens sur les branches main/master.
    if: always() && needs.build-test.result == 'failure' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      LANGS_JSON: ${{ needs.detect-stack.outputs.languages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        if: contains(needs.detect-stack.outputs.languages, 'node')
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Appliquer les correctifs automatiques
        run: |
          set -euo pipefail
          echo "Stacks concernés : $LANGS_JSON"
          for STACK in $(echo "$LANGS_JSON" | jq -r '.include[].lang'); do
            case "$STACK" in
              node)
                if [ -f package.json ]; then
                  echo "→ Node : régénération du lockfile + npm audit fix"
                  npm install --package-lock-only --no-audit --no-fund || true
                  if [ -f package-lock.json ]; then
                    npm audit fix --package-lock-only || true
                  fi
                fi
                ;;
              rust)
                if [ -f Cargo.toml ] && command -v cargo > /dev/null; then
                  echo "→ Rust : cargo fix (tolère le code cassé) + cargo fmt"
                  # --broken-code assumé : le build vient d'échouer.
                  # La PR est étiquetée needs-review : un humain valide.
                  cargo fix --allow-dirty --allow-no-vcs --broken-code || true
                  cargo fmt || true
                fi
                ;;
              *)
                echo "→ $STACK : aucun correctif automatique sûr — audit manuel requis"
                ;;
            esac
          done

      - name: Des modifications ont-elles été produites ?
        id: changes
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "modified=true" >> "$GITHUB_OUTPUT"
            echo "Modifications détectées — une PR de correctif sera créée."
          else
            echo "modified=false" >> "$GITHUB_OUTPUT"
            echo "Aucune modification automatiquement applicable."
          fi

      - name: Créer la PR de correctif
        if: steps.changes.outputs.modified == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "fix(auto-heal): correctif automatique [skip ci]"
          title: "🤖 Auto-Heal : correctif proposé"
          body: |
            Le build a échoué (run #${{ github.run_number }}).
            Correctif généré automatiquement — **vérifiez avant de merger**.

            | Référence | Valeur |
            |---|---|
            | Commit testé | \`${{ github.sha }}\` |
            | Branche | \`${{ github.ref_name }}\` |
          branch: auto-heal/${{ github.run_id }}
          delete-branch: true
          labels: |
            auto-heal
            needs-review

      - name: Ouvrir une issue si aucun correctif n'était possible
        if: steps.changes.outputs.modified == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          EXISTING=$(gh issue list --label auto-heal --state open --json number --jq 'length' 2> /dev/null || echo 0)
          if [ "$EXISTING" -eq 0 ]; then
            gh issue create \
              --title "🤖 Auto-Heal : échec du build sans correctif automatique" \
              --body "Le job **build-test** a échoué (run #$RUN_NUMBER) mais aucun correctif sûr n'a pu être appliqué. Intervention manuelle requise." \
              --label auto-heal \
              || echo "::warning::Création d'issue impossible (label manquant ou droits insuffisants)"
          else
            echo "::notice::Une issue auto-heal est déjà ouverte — pas de spam."
          fi

  # ─── JOB 5 : CERTIFICAT (toujours exécuté, hors PR) ────────────────────────
  sovereign-certificate:
    needs: [security-gate, build-test]
    if: always() && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calculer l'empreinte SHA-256 du workflow
        id: hash
        run: |
          set -euo pipefail
          if [ -f .github/workflows/nexus-sovereign-audit.yml ]; then
            WF_SHA=$(sha256sum .github/workflows/nexus-sovereign-audit.yml | awk '{print $1}')
          else
            # Fallback si le fichier a été renommé : empreinte de l'ensemble
            WF_SHA=$(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 | sort -z | xargs -0 -r cat | sha256sum | awk '{print $1}')
          fi
          echo "workflow_sha=$WF_SHA" >> "$GITHUB_OUTPUT"

      - name: Écrire le certificat
        env:
          COMMIT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ steps.hash.outputs.workflow_sha }}
          SECURITY_RESULT: ${{ needs.security-gate.result }}
          BUILD_RESULT: ${{ needs.build-test.result }}
        run: |
          set -euo pipefail
          cat > CERTIFICATE.md << EOF
          # 🛡️ Certificat Souverain — Nexus Quantum

          **Commit :** \`$COMMIT_SHA\`
          **Workflow SHA-256 :** \`$WORKFLOW_SHA\`
          **Timestamp :** $(date -u +%Y-%m-%dT%H:%M:%SZ)
          **Sécurité :** $SECURITY_RESULT
          **Build :** $BUILD_RESULT

          > Ce certificat est généré localement. Aucune donnée n'a quitté le runner.
          EOF

      - name: Publier dans le résumé
        run: cat CERTIFICATE.md >> "$GITHUB_STEP_SUMMARY"

      - name: Archiver le certificat
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-certificate
          path: CERTIFICATE.md
          if-no-files-found: error
