name: "Nexus Sovereign Audit & Auto-Heal"
on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    types: [ opened, synchronize, reopened ]
  schedule:
    - cron: '0 3 * * 1'   # Chaque lundi 03:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode d exécution'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - security-only
          - auto-heal
permissions:
  contents: write
  pull-requests: write
  security-events: write
  id-token: write
  issues: write
concurrency:
  group: nexus-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1 : DÉTECTION DE STACK (matrice dynamique)
  # ─────────────────────────────────────────────────────────────
  detect-stack:
    runs-on: ubuntu-latest
    outputs:
      languages: ${{ steps.detect.outputs.languages }}
      has_rust: ${{ steps.detect.outputs.has_rust }}
      has_python: ${{ steps.detect.outputs.has_python }}
      has_node: ${{ steps.detect.outputs.has_node }}
      has_cobol: ${{ steps.detect.outputs.has_cobol }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        shell: bash
        run: |
          LANGS=()
          HAS_RUST="false"; HAS_PYTHON="false"; HAS_NODE="false"; HAS_COBOL="false"
          if [ -f "Cargo.toml" ]; then LANGS+=("rust"); HAS_RUST="true"; fi
          if [ -f "requirements.txt" ] || [ -f "pyproject.toml" ]; then LANGS+=("python"); HAS_PYTHON="true"; fi
          if [ -f "package.json" ]; then LANGS+=("node"); HAS_NODE="true"; fi
          if ls *.cob *.cbl 1>/dev/null 2>&1; then LANGS+=("cobol"); HAS_COBOL="true"; fi
          if [ ${#LANGS[@]} -eq 0 ]; then LANGS=("generic"); fi
          echo "languages={\"include\":[$(printf '{"lang":"%s"},' "${LANGS[@]}" | sed 's/,$//')]}" >> "$GITHUB_OUTPUT"
          echo "has_rust=$HAS_RUST" >> "$GITHUB_OUTPUT"
          echo "has_python=$HAS_PYTHON" >> "$GITHUB_OUTPUT"
          echo "has_node=$HAS_NODE" >> "$GITHUB_OUTPUT"
          echo "has_cobol=$HAS_COBOL" >> "$GITHUB_OUTPUT"
  # ─────────────────────────────────────────────────────────────
  # JOB 2 : SÉCURITÉ BLOQUANTE (matrice)
  # ─────────────────────────────────────────────────────────────
  security-gate:
    needs: detect-stack
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-stack.outputs.languages) }}
    steps:
      - uses: actions/checkout@v4
      - name: Audit dépendances (Trivy FS)
        uses: aquasecurity/trivy-action@0.32.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-${{ matrix.lang }}.sarif'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-${{ matrix.lang }}.sarif'
          category: 'trivy-${{ matrix.lang }}'
  # ─────────────────────────────────────────────────────────────
  # JOB 3 : BUILD & TEST (matrice conditionnelle)
  # ─────────────────────────────────────────────────────────────
  build-test:
    needs: detect-stack
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-stack.outputs.languages) }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        if: matrix.lang == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Test Python
        if: matrix.lang == 'python'
        run: |
          pip install -r requirements.txt 2>/dev/null || true
          python -m pytest --tb=short 2>/dev/null || echo "No Python tests"

      - name: Setup Rust
        if: matrix.lang == 'rust'
        uses: dtolnay/rust-toolchain@stable
      - name: Build Rst
        if: matrix.lang == 'rust'
        run: cargo build --release --locked
      - name: Setup Node
        if: matrix.lang == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Build Node
        if: matrix.lang == 'node'
        run: |
          npm ci
          npm run build --if-present
          npm test --if-present
      - name: Setup COBOL
        if: matrix.lang == 'cobol'
        run: sudo apt-get update && sudo apt-get install -y gnucobol
      - name: Compile COBOL
        if: matrix.lang == 'cobol'
        run: |
          for f in *.cob *.cbl; do [ -f "$f" ] && cobc -x "$f"; done
  # ─────────────────────────────────────────────────────────────
  # JOB 4 : AUTO-HEAL (IA générative locale, pas de cloud)
  # ─────────────────────────────────────────────────────────────
  auto-heal:
    needs: [detect-stack, build-test]
    if: |
      always() &&
      (needs.build-test.result == 'failure' || github.event.inputs.mode == 'auto-heal')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Générer un correctif candidat
        id: heal
        shell: bash
        run: |
          echo "## Auto-Heal Report" > heal-report.md
          echo "" >> heal-report.md
          echo "**Déclenché par :** ${{ github.event_name }}" >> heal-report.md
          echo "**Résultat build :** ${{ needs.build-test.result }}" >> heal-report.md
          echo "" >> heal-report.md
          echo "### Fichiers modifiés récemment" >> heal-report.md
          git diff --name-only HEAD~1 HEAD 2>/dev/null >> heal-report.md || echo "Aucun diff" >> heal-report.md

      - name: Créer la PR de correctif
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "fix(auto-heal): correctif automatique [skip ci]"
          title: "🤖 Auto-Heal : correctif proposé"
          body-path: heal-report.md
          branch: auto-heal/${{ github.run_id }}
          delete-branch: true
          labels: |
            auto-heal
            needs-review
  # ─────────────────────────────────────────────────────────────
  # JOB 5 : CERTIFICAT SOUVERAIN (hash local + rapport)
  # ─────────────────────────────────────────────────────────────
  sovereign-certificate:
    needs: [security-gate, build-test]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Calculer l empreinte SHA-256 du commit
        id: hash
        run: |
          SHA=$(sha256sum .github/workflows/nexus-sovereign-audit.yml | awk '{print $1}')
          echo "workflow_sha=$SHA" >> "$GITHUB_OUTPUT"
      - name: Écrire le certificat
        run: |
          cat > CERTIFICATE.md << EOF
          # 🛡️ Certificat Souverain — Nexus Quantum

          **Commit :** \`${{ github.sha }}\`
          **Workflow SHA-256 :** \`${{ steps.hash.outputs.workflow_sha }}\`
          **Timestamp :** $(date -u +%Y-%m-%dT%H:%M:%SZ)
          **Sécurité :** ${{ needs.security-gate.result }}
          **Build :** ${{ needs.build-test.result }}
          > Ce certificat est généré localement. Aucune donnée n'a quitté le runner.
          EOF

      - name: Publier dans le résumé
        run: cat CERTIFICATE.md >> "$GITHUB_STEP_SUMMARY"
