# .github/workflows/consensus.yml
# ═══════════════════════════════════════════════════════════════════════════════
# MULTI-AGENT CONSENSUS — 3 agents votent avant chaque merge
# Feature inédite : aucun outil ne fait de vote démocratique.
# ═══════════════════════════════════════════════════════════════════════════════
name: Multi-Agent Consensus
on:
  pull_request:
    types: [opened, synchronize, labeled]
jobs:
  consensus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Agent SECURITY — Vote
        id: security
        run: |
          # L'agent sécurité vérifie les CVE
          VOTE="APPROVE"
          REASON="No known CVEs"
          
          # Vérifie les dépendances modifiées
          if git diff origin/main -- pyproject.toml | grep -qE '^\+.*(requests|urllib3|pyyaml)'; then
            VOTE="REVIEW"
            REASON="Critical dependency changed"
          fi
  
          echo "VOTE=$VOTE" >> $GITHUB_OUTPUT
          echo "REASON=$REASON" >> $GITHUB_OUTPUT
      - name: Agent QUALITY — Vote
        id: quality
        run: |
          # L'agent qualité vérifie le code
          VOTE="APPROVE"
          REASON="All lint checks pass"
          
          # Vérifie les TODOs critiques
          if git diff origin/main | grep -qE '^\+.*(TODO|FIXME|HACK)'; then
            VOTE="REVIEW"
            REASON="Critical TODOs added"
          fi
          
          echo "VOTE=$VOTE" >> $GITHUB_OUTPUT
          echo "REASON=$REASON" >> $GITHUB_OUTPUT

      - name: Agent PERFORMANCE — Vote
        id: performance
        run: |
          # L'agent performance vérifie les impacts
          VOTE="APPROVE"
          REASON="No performance regression detected"
          
          # Vérifie si des boucles O(n^2) sont ajoutées
          if git diff origin/main | grep -qE '^\+.*for .* in .*:.*for .* in'; then
            VOTE="REVIEW"
            REASON="Nested loops detected (potential O(n^2))"
          fi
          
          echo "VOTE=$VOTE" >> $GITHUB_OUTPUT
          echo "REASON=$REASON" >> $GITHUB_OUTPUT

      - name: Aggregate Votes
        id: aggregate
        run: |
          SEC="${{ steps.security.outputs.VOTE }}"
          QUA="${{ steps.quality.outputs.VOTE }}"
          PER="${{ steps.performance.outputs.VOTE }}"
          
          APPROVES=0
          REVIEWS=0
          
          [ "$SEC" = "APPROVE" ] && APPROVES=$((APPROVES + 1)) || REVIEWS=$((REVIEWS + 1))
          [ "$QUA" = "APPROVE" ] && APPROVES=$((APPROVES + 1)) || REVIEWS=$((REVIEWS + 1))
          [ "$PER" = "APPROVE" ] && APPROVES=$((APPROVES + 1)) || REVIEWS=$((REVIEWS + 1))
          
          echo "APPROVES=$APPROVES" >> $GITHUB_OUTPUT
          echo "REVIEWS=$REVIEWS" >> $GITHUB_OUTPUT

      - name: Publish Consensus Report
        run: |
          {
            echo "### 🗳️ Multi-Agent Consensus"
            echo ""
            echo "| Agent | Vote | Raison |"
            echo "|-------|------|--------|"
            echo "| 🛡️ SECURITY | ${{ steps.security.outputs.VOTE }} | ${{ steps.security.outputs.REASON }} |"
            echo "| ✅ QUALITY | ${{ steps.quality.outputs.VOTE }} | ${{ steps.quality.outputs.REASON }} |"
            echo "| ⚡ PERFORMANCE | ${{ steps.performance.outputs.VOTE }} | ${{ steps.performance.outputs.REASON }} |"
            echo ""
            echo "**Résultat** : ${{ steps.aggregate.outputs.APPROVES }}/3 approbations"
            echo ""
            if [ "${{ steps.aggregate.outputs.REVIEWS }}" -gt 0 ]; then
              echo "⚠️ **Review manuelle requise** (au moins un agent a voté REVIEW)"
            else
              echo "✅ **Consensus atteint** (auto-merge autorisé)"
            fi
          } >> $GITHUB_STEP_SUMMARY

      - name: Block if No Consensus
        if: steps.aggregate.outputs.REVIEWS > 0
        run: |
          echo "::warning::Consensus non atteint. Review manuelle requise."
