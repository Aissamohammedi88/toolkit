name: "🛡️ Secret Fortress — Multi-Engine Secret Scanning"
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 4 * * 1'   # Chaque lundi 04:00 UTC (scan complet)
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
  pull-requests: write
concurrency:
  group: secret-fortress-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # ─── MOTEUR 1 : GITLEAKS (rapide, diff/PR) ───────────────────────
  gitleaks-fast:
    name: "⚡ Gitleaks (diff scan)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks — scan de la diff
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --report-format sarif --report-path gitleaks.sarif --exit-code 1
      - name: Upload SARIF Gitleaks
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
  # ─── MOTEUR 2 : TRUFFLEHOG (historique complet + vérification) ──
  trufflehog-verified:
    name: "🔍 TruffleHog (verified secrets)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historique complet obligatoire
      - name: TruffleHog — scan vérifié
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified --json
      - name: Upload SARIF TruffleHog
        if: always()
        run: |
          if [ -f trufflehog.json ]; then
            echo "TruffleHog findings:"
            cat trufflehog.json | jq -r '.SourceMetadata.Data.Git.file // "unknown"' | sort | uniq -c
          fi
  # ─── MOTEUR 3 : SEMGREP (analyse sémantique, p/secrets) ─────────
  semgrep-secrets:
    name: "🧠 Semgrep (secrets + security)"
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep — scan des secrets
        run: |
          semgrep ci \
            --config p/secrets \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --sarif --output semgrep.sarif \
            --error
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      - name: Upload SARIF Semgrep
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
  # ─── MOTEUR 4 : DETECT-SECRETS (baseline + plugins) ─────────────
  detect-secrets:
    name: "🔬 detect-secrets (baseline)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install detect-secrets
        run: pip install detect-secrets
      - name: Scan avec baseline
        run: |
          # Génère une baseline si elle n'existe pas
          if [ ! -f .secrets.baseline ]; then
            detect-secrets scan --all-files > .secrets.baseline
          fi
          # Compare avec la baseline
          detect-secrets scan --baseline .secrets.baseline --all-files
        continue-on-error: false
  # ─── MOTEUR 5 : TRIVY (secrets dans les fichiers) ────────────────
  trivy-secret:
    name: "📦 Trivy (filesystem secrets)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy — scan de secrets
        uses: aquasecurity/trivy-action@0.32.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'secret'
          format: 'sarif'
          output: 'trivy-secret.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '1'
      - name: Upload SARIF Trivy
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-secret.sarif
          category: trivy-secret
  # ─── RAPPORT FINAL (agrégation) ─────────────────────────────────
  secret-report:
    name: "📊 Rapport final"
    needs: [gitleaks-fast, trufflehog-verified, semgrep-secrets, detect-secrets, trivy-secret]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Résumé des moteurs
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## 🛡️ Secret Fortress — Résultats

          | Moteur | Statut | Rôle |
          |--------|--------|------|
          EOF
          echo "| Gitleaks | ${{ needs.gitleaks-fast.result }} | Regex rapide (800+ motifs) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| TruffleHog | ${{ needs.trufflehog-verified.result }} | Vérification en direct |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Semgrep | ${{ needs.semgrep-secrets.result }} | Analyse sémantique |" >> "$GITHUB_STEP_SUMMARY"
          echo "| detect-secrets | ${{ needs.detect-secrets.result }} | Baseline + plugins |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Trivy | ${{ needs.trivy-secret.result }} | Secrets fichiers |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> **Règle** : Si un seul moteur échoue, le workflow est bloqué. La redondance couvre les angles morts de chaque outil." >> "$GITHUB_STEP_SUMMARY"
