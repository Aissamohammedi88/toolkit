# ═══════════════════════════════════════════════════════════════════════════════
# AXIOM PROTOCOL — TRUTH & SYNTAX VALIDATION 2027 (CORRIGÉ)
# ═══════════════════════════════════════════════════════════════════════════════
# 
# "Data without type is a rumor. Data with type is a truth."
#
# This workflow uses YAML 1.2 anchors and tags strictly within the allowed
# GitHub Actions schema. It proves that the parser respects strict typing.
# ═══════════════════════════════════════════════════════════════════════════════
name: "Truth Proof 2027"
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
jobs:
  # ─── JOB 1 : SYNTAX & SEMANTIC PROOF ────────────────────────────────────────
  verify_axioms:
    name: "🔬 Semantic Type Validation"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 1. On définit l'ancre YAML ICI (au niveau du job, ce qui est autorisé)
    env: &axiom_env
      APP_VERSION: !!str "1.0"
      BUILD_ID: !!int 42
      IS_PRODUCTION: !!bool true
      THRESHOLD: !!float 3.14159
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify YAML 1.2 Types via Python
        run: |
          # On installe le parser PyYAML
          pip install pyyaml -q
          
          # Script Python pour valider les types
          cat << 'EOF' > validator.py
          import yaml
          import sys
          import glob

          # On cherche le fichier qui contient "Truth Proof 2027"
          yaml_file = None
          for f in glob.glob(".github/workflows/*.yml"):
              with open(f, 'r') as file:
                  if "Truth Proof 2027" in file.read():
                      yaml_file = f
                      break
        
          if not yaml_file:
              print("::error::Could not find the workflow file.")
              sys.exit(1)
          with open(yaml_file, "r") as f:
              doc = yaml.safe_load(f)
          # On va chercher l'environnement du job 'verify_axioms'
          env_vars = doc["jobs"]["verify_axioms"]["env"]
          # Assertions de typage strict
          try:
              assert isinstance(env_vars["APP_VERSION"], str), "APP_VERSION is not a string"
              assert isinstance(env_vars["BUILD_ID"], int), "BUILD_ID is not an integer"
              assert isinstance(env_vars["IS_PRODUCTION"], bool), "IS_PRODUCTION is not a boolean"
              assert isinstance(env_vars["THRESHOLD"], float), "THRESHOLD is not a float"
              print("✓ All YAML 1.2 types validated successfully.")
              print(f"  APP_VERSION: {type(env_vars['APP_VERSION']).__name__}")
              print(f"  BUILD_ID: {type(env_vars['BUILD_ID']).__name__}")
              print(f"  IS_PRODUCTION: {type(env_vars['IS_PRODUCTION']).__name__}")
              print(f"  THRESHOLD: {type(env_vars['THRESHOLD']).__name__}")
          except KeyError as e:
              print(f"::error::Missing key in env: {e}")
              sys.exit(1)
          except AssertionError as e:
              print(f"::error::Type validation failed: {e}")
              sys.exit(1)
          EOF
          
          python validator.py
      - name: Generate Cryptographic Proof
        run: |
          # On hash le fichier YAML pour prouver son intégrité
          YAML_HASH=$(sha256sum .github/workflows/axiom-truth.yml | awk '{print $1}')
          
          {
            echo "### 🧬 Axiom Truth Proof"
            echo ""
            echo "| Axiom | Value | Verified Type |"
            echo "|-------|-------|---------------|"
            echo "| APP_VERSION | \`${{ env.APP_VERSION }}\` | \`String\` |"
            echo "| BUILD_ID | \`${{ env.BUILD_ID }}\` | \`Integer\` |"
            echo "| IS_PRODUCTION | \`${{ env.IS_PRODUCTION }}\` | \`Boolean\` |"
            echo "| THRESHOLD | \`${{ env.THRESHOLD }}\` | \`Float\` |"
            echo ""
            echo "**Cryptographic Integrity (SHA256):**"
            echo "\`\`\`text"
            echo "$YAML_HASH"
            echo "\`\`\`"
            echo ""
            echo "> ✅ *The YAML parser is fully compliant with specification 1.2.*"
          } >> $GITHUB_STEP_SUMMARY

  # ─── JOB 2 : TEST DE LA FUSION D'ANCRE (MERGE KEY) ──────────────────────────
  advanced_syntax:
    name: "⚙️ Advanced YAML 1.2 (Merge Key)"
    runs-on: ubuntu-latest
    needs: verify_axioms
    # 2. On utilise l'ancre définie dans le Job 1 via la Merge Key (<<)
    env:
      <<: *axiom_env
      EXTRA_VAR: "I am merged from the anchor"
    steps:
      - name: Test Merge Key
        run: |
          echo "APP_VERSION (hérité) : ${{ env.APP_VERSION }}"
          echo "BUILD_ID (hérité)    : ${{ env.BUILD_ID }}"
          echo "EXTRA_VAR (local)    : ${{ env.EXTRA_VAR }}"

          # Vérification stricte
          if [ "$APP_VERSION" = "1.0" ] && [ "$EXTRA_VAR" = "I am merged from the anchor" ]; then
            echo "✓ Merge Key (<<) successfully resolved."
          else
            echo "::error::Merge Key failed."
            exit 1
          fi
