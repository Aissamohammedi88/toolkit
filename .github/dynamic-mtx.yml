name: "Dynamic Matrix"
on:
  pull_request:
    branches: [main, master]
permissions:
  contents: read
concurrency:
  group: "matrix-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: set
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -E '^packages/[^/]+/' | cut -d/ -f2 | sort -u || true)
          else
            CHANGED=$(git diff --name-only HEAD~1 | grep -E '^packages/[^/]+/' | cut -d/ -f2 | sort -u || true)
          fi
          if [ -z "$CHANGED" ]; then
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
          else
            JSON=$(printf '%s\n' "$CHANGED" | jq -R -s -c 'split("\n") | map(select(length>0)) | {include: map({package: .})}')
            echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: detect
    if: needs.detect.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'packages/${{ matrix.package }}/package-lock.json'
      - run: npm ci
        working-directory: packages/${{ matrix.package }}
      - run: npm run build --if-present
        working-directory: packages/${{ matrix.package }}
