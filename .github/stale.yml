# ═══════════════════════════════════════════════════════════════════════════════
# STALE PROTOCOL — NEXUS ULTRA
# ═══════════════════════════════════════════════════════════════════════════════
# Stratégie :
#   - Nettoyage des Issues sans activité depuis 30 jours.
#   - Nettoyage des Pull Requests sans activité depuis 45 jours.
#   - Fermeture automatique après 7 jours d'inactivité suite à l'avertissement.
#   - Ne touche jamais aux Issues labellisées "pinned" ou "security".
# ═══════════════════════════════════════════════════════════════════════════════
name: "🧹 Stale Protocol"
on:
  schedule:
    - cron: '30 1 * * *'
permissions:
  issues: write
  pull-requests: write
jobs:
  stale:
    name: "🗑️ Auto-Cleanup"
    runs-on: ubuntu-latest
    steps:
      - name: Close Stale Issues and PRs
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: |
            ⚠️ Cette issue est inactive depuis 30 jours.
            Elle sera fermée automatiquement dans 7 jours si aucune mise à jour n'est apportée.
          close-issue-message: |
            🔒 Issue fermée pour cause d'inactivité. Rouvrez-la si le sujet est toujours d'actualité.
          stale-pr-message: |
            ⚠️ Cette Pull Request est inactive depuis 45 jours. 
            Merci de la mettre à jour ou elle sera fermée dans 7 jours.
          close-pr-message: |
            🔒 PR fermée. L'architecture n'attend pas.
          days-before-stale: 30
          days-before-close: 7
          days-before-pr-stale: 45
          exempt-issue-labels: 'pinned,security,in-progress'
          exempt-pr-labels: 'pinned,security,in-progress'
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
