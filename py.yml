# ═════════════════════════════════════════════════════════════════════════════
# NEXUS DEVQUEST — workflow GitHub Actions
# ═════════════════════════════════════════════════════════════════════════════
# Transforme ton repo en RPG. À chaque push :
#   1. Calcule XP (lignes + fichiers + commits)
#   2. Met à jour niveau + titre (Novice → Légende)
#   3. Génère 3 badges SVG animés (level, title, xp)
#   4. Génère un avatar ASCII basé sur les langages du repo
#   5. Génère 3 "quêtes" adaptées à l'état du repo
#   6. Écrit README-devquest.md (fiche de personnage)
#   7. Archive chaque niveau dans .devquest/history.jsonl
#   8. Commit + push automatique (via GITHUB_TOKEN, [skip ci])
#
# Stack : YAML pur + Python 3 stdlib (zéro dépendance, zéro pip).
# Auteur : Aissa Mohammedi (DGK)
# License: NEXUS-OPEN-3.0
# ═════════════════════════════════════════════════════════════════════════════

name: Nexus DevQuest

on:
  push:
    branches: ain, master]
  workflow_dispatch:

permissions:
  contents: write   # pour commit/push les badges + README
  actions: read

concurrency:
  group: nexus-devquest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  level-up:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (full history for XP calc)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
...
--- tail ---
        run: |
          git config user.name "Nexus DevQuest"
          git config user.email "devquest@nexus.local"
          git add .devquest/ badges/ README-devquest.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "ℹ No DevQuest changes to commit."
            exit 0
          fi
          git commit -m "⚛ devquest: level up [skip ci]"
          git push

      - name: Step Summary (visible dans l'onglet Summary)
        if: always()
        run: |
          if [ -f .devquest/state.json ]; then
            python3 - <<'PYEOF'
          import json
          with open(".devquest/state.json") as f:
              s = json.load(f)
          print(f"### ⚛ Nexus DevQuest — Niveau {s['level']} ({s['title']})")
          print("")
          print(f"**XP** : {s['xp']:,}")
          print(f"**Achievements débloqués** : {len(s['achievements'])}")
          print(f"**Commits cumulés** : {s['total_commits']}")
          print(f"**Langages détectés** : {len(s['languages'])}")
          print(f"**Fiche de personnage** : \`README-devquest.md\`")
          PYEOF
          else
            echo "⚠ .devquest/state.json absent"
          fi
