name: "⚡ NEXUS OMEGA - Java Auto-Heal & Deploy (2027)"
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
# Principe du moindre privilège
permissions:
  contents: read

env:
  # Java 21 LTS est le standard 2027 (Java 17 est en fin de vie)
  JAVA_VERSION: "21"
  JAVA_DISTRIBUTION: "temurin" # Eclipse Temurin est le standard open-source
jobs:
  # ============================================================================
  # JOB 1 : AUTO-REPAIR (Nettoyage et formatage)
  # ============================================================================
  auto_repair:
    name: "🔧 Usine de Nettoyage Java"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      changes_made: ${{ steps.check_changes.outputs.changes }}
    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "☕ Setup Java 21 LTS"
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          # Cache natif intelligent (Maven ou Gradle détecté automatiquement)
          cache: ${{ hashFiles('**/pom.xml') != '' && 'maven' || hashFiles('**/build.gradle*') != '' && 'gradle' || '' }}

      - name: "🛠️ Download Google Java Format (2027 Version)"
        run: |
          # Téléchargement de la dernière version stable de l'outil de formatage
          curl -sSL -o /tmp/gjf.jar https://github.com/google/google-java-format/releases/download/v1.23.0/google-java-format-1.23.0-all-deps.jar
          chmod +x /tmp/gjf.jar

      - name: "🧹 Format Java Code"
        continue-on-error: true
        run: |
          # Trouve les fichiers .java en excluant les dossiers de build
          if find . -name "*.java" -not -path "*/target/*" -not -path "*/build/*" -not -path "*/.git/*" | grep -q .; then
            find . -name "*.java" -not -path "*/target/*" -not -path "*/build/*" -not -path "*/.git/*" \
              -exec java -jar /tmp/gjf.jar --replace {} +
            echo "✓ Fichiers Java formatés."
          else
            echo "Aucun fichier Java à formater."
          fi

      - name: "📊 Check Changes"
        id: check_changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: "🚀 Create PR (Si formatage nécessaire)"
        if: steps.check_changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "style: auto-format Java code (google-java-format)"
          title: "🩺 Auto-Réparation : Formatage Java"
          branch: nexus-omega/java-repair-${{ github.run_id }}
          delete-branch: true

  # ============================================================================
  # JOB 2 : BUILD & TEST (Maven / Gradle détectés)
  # ============================================================================
  build_and_test:
    name: "🏗️ Build & Test"
    runs-on: ubuntu-latest
    needs: auto_repair
    if: needs.auto_repair.outputs.changes_made == 'false' || github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: "☕ Setup Java 21"
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: ${{ hashFiles('**/pom.xml') != '' && 'maven' || hashFiles('**/build.gradle*') != '' && 'gradle' || '' }}

      # --- MAVEN ---
      - name: "📦 Build & Test (Maven)"
        if: hashFiles('**/pom.xml') != ''
        run: |
          mvn -B -ntp clean verify
          # -ntp : No Transfer Progress (logs propres)
          # verify : compile + test + package

      # --- GRADLE ---
      - name: "📦 Build & Test (Gradle)"
        if: hashFiles('**/build.gradle') != '' || hashFiles('**/build.gradle.kts') != ''
        run: |
          chmod +x gradlew || true
          ./gradlew build --no-daemon || gradle build --no-daemon
          # --no-daemon : évite les fuites de mémoire sur les runners

      - name: "🛡️ Security Scan (Trivy)"
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  # ============================================================================
  # JOB 3 : DEPLOY (Uniquement sur main)
  # ============================================================================
  deploy:
    name: "🚀 Déploiement Souverain"
    runs-on: ubuntu-latest
    needs: [auto_repair, build_and_test]
    if: github.ref == 'refs/heads/main' && needs.build_and_test.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: "☕ Setup Java"
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - name: "📦 Package for Deployment"
        run: |
          mkdir -p dist
          if [ -f "pom.xml" ]; then
            mvn -B -ntp package -DskipTests
            cp target/*.jar dist/ 2>/dev/null || true
          fi
          
          if [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            ./gradlew assemble -x test || gradle assemble -x test
            cp build/libs/*.jar dist/ 2>/dev/null || true
          fi
          echo "Build ${{ github.sha }} - $(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/build-info.txt
      - name: "📤 Upload Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: nexus-omega-java-build
          path: dist/
          retention-days: 30
